name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: "Version stamped into the jar name and fabric.mod.json"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOD_VERSION: ${{ inputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pmod_version="$MOD_VERSION"

      # Only the main jar: release.yml refuses any jar whose name does not end in -<version>.jar.
      - uses: actions/upload-artifact@v7
        with:
          name: auto-attributes-${{ env.MOD_VERSION }}-fabric
          path: build/libs/auto-attributes-${{ env.MOD_VERSION }}.jar
          if-no-files-found: error
