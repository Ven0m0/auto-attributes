repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.(bat)$'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.bat$'
      - id: detect-private-key

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: spotless
        name: spotless (google-java-format)
        entry: ./gradlew spotlessApply --quiet
        language: system
        files: '\.java$'
        pass_filenames: false
